<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UDP Airband Admin - Users</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">UDP Airband Server</p>
      <h1>Web Admin</h1>
    </div>
    <div class="topbar-actions">
      <div class="server-summary">
        <span class="status-dot online" role="status" aria-label="Server online" title="Server online"></span>
        <span>__SOFTWARE_VERSION__</span>
      </div>
      <select class="language-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="es">ES</option>
      </select>
    </div>
  </header>

  <main></main>
</body>
</html>
