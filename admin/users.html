<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UDP Airband Admin - Users</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/admin.css">
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="/users.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">UDP Airband Server</p>
      <h1>Web Admin</h1>
    </div>
    <div class="topbar-actions">
      <div class="server-summary">
        <span class="status-dot online" role="status" aria-label="Server online" title="Server online"></span>
        <span>__SOFTWARE_VERSION__</span>
      </div>
      <select id="languageSelect" class="language-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="es">ES</option>
      </select>
    </div>
  </header>

  <main>
    <a class="users-back" href="/" data-i18n="backToAdmin">&lt; Back</a>

    <section class="panel geo-panel">
      <div class="section-heading geo-heading">
        <h2 data-i18n="listenerGeography">Listener Geography</h2>
      </div>

      <div class="geo-layout">
        <div class="geo-chart-area">
          <div id="geoChart" class="geo-chart" aria-label="Listener geography map" data-i18n-aria="mapAria"></div>
          <p id="geoMessage" class="geo-message visible" role="status" aria-live="polite" data-i18n="loadingMap">Loading map...</p>
        </div>
        <aside id="countryDetail" class="country-detail" hidden>
          <p id="countryDetailEyebrow" class="eyebrow" data-i18n="selectedCountry">Selected country</p>
          <h2 id="countryName"></h2>
          <p class="country-total"><span data-i18n="listeners">Listeners</span>: <strong id="countryListeners">0</strong></p>
          <div id="cityList" class="city-list"></div>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
